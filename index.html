<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>Meu Treino ABC</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1320;color:#f4f6fa}main{max-width:720px;margin:auto;padding:18px 16px 100px}h1{font-size:23px;margin:10px 0}h2{font-size:19px}p,small{color:#b6c2d2}.tabs,.actions,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,.btn{background:#253348;border:1px solid #46566e;color:white;border-radius:11px;padding:12px;cursor:pointer;font-size:15px}button.active,.primary{background:#3d80ed;border-color:#3d80ed}button:disabled{opacity:.4}.tabs button{flex:1}section,.card{background:#172235;border:1px solid #2e4059;border-radius:14px;padding:15px;margin:13px 0}.exercise{border-top:1px solid #35465d;padding:14px 0}.exercise:first-child{border-top:0}.row{justify-content:space-between}.fields{display:grid;grid-template-columns:38px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}input,select{width:100%;background:#0e1725;border:1px solid #40516b;border-radius:8px;padding:11px;color:white;font:inherit}label{font-size:13px;color:#b6c2d2}.muted{color:#a8b6ca;font-size:13px}.day{min-height:53px;border-radius:8px;padding:5px;text-align:center;background:#253348}.day.hit{background:#205a53}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hidden{display:none}.danger{background:#642b38}.full{width:100%;margin-top:12px}.title{font-weight:700}a{color:#99c5ff}</style></head><body><main><header><h1>💪 Meu Treino ABC</h1><p>Treine, registre cargas e acompanhe sua evolução.</p></header><nav class="tabs"><button data-tab="treino" class="active">Treinar</button><button data-tab="historico">Histórico</button><button data-tab="calendario">Calendário</button><button data-tab="ajustes">Ajustes</button></nav><div id="view"></div></main><script>
const base={
A:[["Hack / Smith",3,"6–10"],["Supino reto máquina / Smith",4,"6–10"],["Remada máquina apoiada",3,"8–12"],["Elevação lateral cabo + drop",4,"10–20"],["Hip thrust",3,"8–12"],["Rosca Scott",3,"8–12"],["Flexora",2,"10–15"],["Tríceps polia",2,"10–15"],["Crunch polia",3,"10–15"]],
B:[["Stiff / RDL",3,"6–10"],["Desenvolvimento máquina",3,"6–10"],["Puxada alta",3,"8–12"],["Supino inclinado máquina",4,"8–12"],["Cadeira extensora",2,"10–15"],["Crucifixo inverso",3,"12–20"],["Rosca cabo braço atrás + drop",4,"10–15"],["Panturrilha máquina",3,"8–15"],["Abdominal máquina",3,"10–15"]],
C:[["Leg press 45°",3,"8–12"],["Chest press máquina",3,"8–12"],["Peck deck / crossover + drop",2,"10–15"],["Remada baixa",3,"8–12"],["Elevação lateral máquina + rest-pause",4,"12–20"],["Rosca martelo + rest-pause",4,"8–12"],["Abdutora",3,"12–20"],["Tríceps corda",2,"10–15"],["Crunch polia",3,"10–15"]]};
const key="meu-treino-abc-v1";let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}state=state||{plans:base,history:[],drafts:{},chosen:"A"};state.plans||=base;state.history||=[];state.drafts||={};let tab="treino",month=new Date();const view=document.getElementById("view"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),save=()=>localStorage.setItem(key,JSON.stringify(state)),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-"),fmt=d=>new Date(d).toLocaleString("pt-BR"),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function draft(){let t=state.chosen;return state.drafts[t]||=(state.plans[t]||[]).map(e=>Array.from({length:Number(e[1])||1},()=>({kg:"",reps:""})))}function last(name){for(const h of [...state.history].reverse()){let e=h.exercises?.find(x=>x.name===name);if(e)return e.sets.map(s=>s.kg||"–").join(" / ")+" kg"}return "Sem registro"}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));if(tab==="treino")return training();if(tab==="historico")return history();if(tab==="calendario")return calendar();settings()}
function training(){let t=state.chosen,plan=state.plans[t],d=draft();view.innerHTML='<section><h2>Treino '+t+'</h2><div class="tabs">'+["A","B","C"].map(x=>'<button class="'+(x===t?"active":"")+'" data-choose="'+x+'">Treino '+x+'</button>').join("")+'</div><p>As cargas são salvas automaticamente neste aparelho.</p></section><section>'+plan.map((e,i)=>'<div class="exercise"><div class="title">'+esc(e[0])+'</div><div class="muted">'+e[1]+' séries · '+esc(e[2])+' repetições · Última carga: '+esc(last(e[0]))+'</div><div class="fields"><label>Série</label><label>Peso (kg)</label><label>Reps feitas</label></div>'+d[i].map((s,j)=>'<div class="fields"><span>'+(j+1)+'</span><input inputmode="decimal" aria-label="Peso série '+(j+1)+'" data-i="'+i+'" data-j="'+j+'" data-f="kg" value="'+esc(s.kg)+'" placeholder="kg"><input inputmode="numeric" aria-label="Repetições série '+(j+1)+'" data-i="'+i+'" data-j="'+j+'" data-f="reps" value="'+esc(s.reps)+'" placeholder="reps"></div>').join("")+'</div>').join("")+'</section><button class="primary full" id="finish">✓ Finalizar treino '+t+'</button>';view.querySelectorAll("[data-choose]").forEach(b=>b.onclick=()=>{state.chosen=b.dataset.choose;save();render()});view.querySelectorAll("input").forEach(el=>el.oninput=()=>{d[+el.dataset.i][+el.dataset.j][el.dataset.f]=el.value;save()});document.getElementById("finish").onclick=()=>{if(!confirm("Finalizar e salvar o treino "+t+" de hoje?"))return;let h={id:id(),type:t,date:new Date().toISOString(),exercises:plan.map((e,i)=>({name:e[0],target:e[2],sets:d[i].map(s=>({...s}))}))};state.history.push(h);delete state.drafts[t];save();tab="historico";render();alert("Treino salvo! Você pode exportá-lo para o Google Agenda.")}}
function history(){view.innerHTML='<section><h2>Histórico de treinos</h2><p>'+state.history.length+' sessões registradas.</p></section>'+[...state.history].reverse().map(h=>'<section><div class="row"><div><strong>Treino '+esc(h.type)+'</strong><div class="muted">'+fmt(h.date)+'</div></div><div class="actions"><button data-ics="'+h.id+'">Google Agenda (.ics)</button><button data-del="'+h.id+'" class="danger">Excluir</button></div></div><details><summary>Ver exercícios e cargas</summary>'+h.exercises.map(e=>'<p><b>'+esc(e.name)+'</b><br>'+e.sets.map((s,i)=>(i+1)+': '+esc(s.kg||"–")+' kg × '+esc(s.reps||"–")).join(" | ")+'</p>').join("")+'</details></section>').join("");view.querySelectorAll("[data-ics]").forEach(b=>b.onclick=()=>ics(state.history.find(h=>h.id===b.dataset.ics)));view.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("Excluir este registro?")){state.history=state.history.filter(h=>h.id!==b.dataset.del);save();render()}})}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),n=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;let map={};state.history.forEach(h=>{let k=dateKey(new Date(h.date));(map[k]||=[]).push(h.type)});view.innerHTML='<section><div class="row"><button id="prev">‹</button><h2>'+month.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</h2><button id="next">›</button></div><div class="cal">'+["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(x=>'<div class="muted" style="text-align:center">'+x+'</div>').join("")+Array(offset).fill('<div></div>').join("")+Array.from({length:n},(_,i)=>{let k=dateKey(new Date(y,m,i+1)),v=map[k]||[];return '<div class="day '+(v.length?"hit":"")+'">'+(i+1)+'<div class="muted">'+esc(v.join(","))+'</div></div>'}).join("")+'</div></section><p>Os dias marcados mostram os treinos concluídos.</p>';document.getElementById("prev").onclick=()=>{month=new Date(y,m-1,1);render()};document.getElementById("next").onclick=()=>{month=new Date(y,m+1,1);render()}}
function settings(){view.innerHTML='<section><h2>Editar fichas</h2><p>Formato: exercício | número de séries | faixa de repetições. Uma linha por exercício. As mudanças não alteram treinos já concluídos.</p><div class="tabs">'+["A","B","C"].map(t=>'<button data-edit="'+t+'">Editar '+t+'</button>').join("")+'</div><div id="editor"></div></section><section><h2>Backup dos dados</h2><p>Os dados não sincronizam entre aparelhos. Exporte o backup para transferir ou preservar seu histórico.</p><button id="export">Exportar backup JSON</button> <label class="btn" for="import">Importar backup</label><input id="import" type="file" accept=".json,application/json" class="hidden"></section>';view.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editor(b.dataset.edit));document.getElementById("export").onclick=()=>download("meu-treino-backup-"+dateKey(new Date())+".json",JSON.stringify(state,null,2),"application/json");document.getElementById("import").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.plans||!Array.isArray(obj.history))throw Error("Formato inválido");if(confirm("Substituir os dados deste aparelho pelo backup?")){state=obj;save();render();alert("Backup importado.")}}catch(err){alert("Não foi possível importar: "+err.message)}};editor("A")}
function editor(t){let el=document.getElementById("editor");if(!el)return;el.innerHTML='<h3>Treino '+t+'</h3><textarea id="plan" style="width:100%;min-height:270px;background:#0e1725;color:white;padding:12px;border-radius:9px;border:1px solid #40516b">'+esc(state.plans[t].map(e=>e.join(" | ")).join("\n"))+'</textarea><button class="primary full" id="saveplan">Salvar ficha '+t+'</button>';document.getElementById("saveplan").onclick=()=>{let arr=document.getElementById("plan").value.split("\n").filter(x=>x.trim()).map(x=>x.split("|").map(z=>z.trim()));if(arr.some(x=>x.length!==3||!x[0]||!(+x[1]>0&&+x[1]<=12))){alert("Confira o formato de cada linha.");return}state.plans[t]=arr.map(x=>[x[0],+x[1],x[2]]);delete state.drafts[t];save();alert("Ficha "+t+" atualizada!")}}
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function ics(h){let d=new Date(h.date),end=new Date(d.getTime()+60*60000),dt=x=>x.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""),desc=h.exercises.map(e=>e.name+": "+e.sets.map(s=>(s.kg||"-")+"kg x "+(s.reps||"-")).join(", ")).join("\\n").replace(/,/g,"\\,");let txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Meu Treino ABC//PT-BR","BEGIN:VEVENT","UID:"+h.id+"@meutreinoabc","DTSTAMP:"+dt(new Date()),"DTSTART:"+dt(d),"DTEND:"+dt(end),"SUMMARY:Treino "+h.type+" finalizado","DESCRIPTION:"+desc,"END:VEVENT","END:VCALENDAR"].join("\r\n");download("treino-"+h.type+"-"+dateKey(d)+".ics",txt,"text/calendar")}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));render();
</script></body></html>
